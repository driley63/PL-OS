<script>
(() => {
  const root = document.getElementById("plectara-mint-card-preview");
  const assets = JSON.parse(root.querySelector("#pg-assets").textContent);
  const appearance = root.querySelector("#pg-appearance");
  const feedback = root.querySelector(".pg-feedback");
  const state = { appearance: "light", cardBorder: "copper", monochromeLogo: false, focusTreatment: "gentle" };
  function restore(snapshot) {
    const content = snapshot && snapshot.modelContent;
    const saved = content && (content.mintCardWidgetProposal || content.gentleFocusWidgetProposal || content.clearYarnWidgetProposal || content.yarnCardWidgetProposal || content.wholeYarnWidgetProposal);
    if (!saved) return;
    if (["device", "light", "dark", "tinted"].includes(saved.appearance)) state.appearance = saved.appearance;
    if (["copper", "jade"].includes(saved.cardBorder)) state.cardBorder = saved.cardBorder;
    if (typeof saved.monochromeLogo === "boolean") state.monochromeLogo = saved.monochromeLogo;
    if (["gentle", "previous"].includes(saved.focusTreatment)) state.focusTreatment = saved.focusTreatment;
  }
  function render() {
    root.dataset.appearance = state.appearance;
    root.dataset.cardBorder = state.cardBorder;
    root.dataset.yarnCrop = "clear";
    root.dataset.focusTreatment = state.focusTreatment;
    root.style.setProperty("--pg-weave-image", "url(" + (state.focusTreatment === "previous" ? assets.comparisonTexture : assets.texture) + ")");
    appearance.value = state.appearance;
    root.querySelectorAll("[data-brand]").forEach(image => {
      const key = image.dataset.brand;
      const next = key === "symbol" ? assets.symbol
        : key === "lock" || state.appearance === "tinted" || state.monochromeLogo ? assets.mono : assets.color;
      if (image.getAttribute("src") !== next) image.setAttribute("src", next);
    });
  }
  function remember() {
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({
        modelContent: { mintCardWidgetProposal: { ...state, yarnCrop: "clear", divider: "soft" } },
        privateContent: null
      }).catch(() => {});
    }
  }
  restore(window.openai && window.openai.widgetState);
  render();
  window.addEventListener("openai:set_globals", event => {
    restore(event.detail && event.detail.globals && event.detail.globals.widgetState);
    render();
  });
  appearance.addEventListener("change", () => { state.appearance = appearance.value; render(); remember(); });
  root.querySelectorAll("[data-action]").forEach(button => {
    button.addEventListener("click", () => {
      const action = button.dataset.action;
      feedback.textContent = action === "Capture" ? "Preview: opens general Capture in the app."
        : "Preview: opens capture for " + action + " in the app.";
    });
  });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: () => { render(); remember(); } });
    tweak.addSelect(state, "focusTreatment", { label: "Focus transition", options: [{ label: "Gentler left focus", value: "gentle" }, { label: "Previous focus", value: "previous" }] });
    tweak.addSelect(state, "cardBorder", { label: "Card outline", options: [{ label: "Copper", value: "copper" }, { label: "Jade", value: "jade" }] });
    tweak.addToggle(state, "monochromeLogo", { label: "Monochrome logo" });
  }
})();
</script>

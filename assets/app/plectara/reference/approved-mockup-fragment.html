    #plectara-four-screen-theme-review *{box-sizing:border-box}
    #plectara-four-screen-theme-review .p-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
    #plectara-four-screen-theme-review .p-caption{font-size:13px;line-height:20px;font-weight:500;margin:0 0 10px;color:inherit}
    #plectara-four-screen-theme-review .p-phone{--p-card:#E9F3EF;--p-text:#192D38;--p-muted:#506F7E;--p-control:#FFFFFF;--p-soft:#E9F3EF;--p-action:#287E80;--p-on-action:#FFFFFF;--p-link:#206668;--p-outline:#567788;--p-border:#C88764;--p-nav:#E9F3EF;--p-selected:#FFFFFF;--p-warning:#845800;color-scheme:light;position:relative;isolation:isolate;overflow:hidden;min-width:0;background:#FAF8F4;color:var(--p-text);border:1px solid #8DA4A6;border-radius:26px;font-size:14px;line-height:1.5}
    #plectara-four-screen-theme-review .p-phone[data-theme="dark"]{--p-card:#192D38;--p-text:#FAF8F4;--p-muted:#B8CBCB;--p-control:#264C4B;--p-soft:#223D49;--p-action:#76B7A5;--p-on-action:#192D38;--p-link:#8DC7B7;--p-outline:#8DA4A6;--p-nav:#192D38;--p-selected:#264C4B;--p-warning:#E5B86A;color-scheme:dark;background:#192D38}
    #plectara-four-screen-theme-review[data-dark-card="surface"] .p-phone[data-theme="dark"]{--p-card:#223D49}
    #plectara-four-screen-theme-review[data-copper="false"] .p-phone{--p-border:var(--p-outline)}
    #plectara-four-screen-theme-review .p-yarn{position:absolute;left:50%;top:50%;z-index:-2;background-image:var(--p-yarn);background-size:cover;background-repeat:no-repeat;background-position:left center;transform:translate(-50%,-50%) rotate(55deg);pointer-events:none}
    #plectara-four-screen-theme-review[data-texture="header"] .p-yarn{display:none}
    #plectara-four-screen-theme-review .p-header{position:relative;isolation:isolate;color:#FAF8F4;padding:14px 14px 12px;min-height:112px}
    #plectara-four-screen-theme-review .p-header::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(25,45,56,.96) 0%,rgba(25,45,56,.92) 20%,rgba(25,45,56,.82) 38%,rgba(25,45,56,.66) 56%,rgba(25,45,56,.22) 80%,rgba(25,45,56,.08) 100%)}
    #plectara-four-screen-theme-review[data-texture="header"] .p-header{background:var(--p-yarn) left center/cover}
    #plectara-four-screen-theme-review .p-status{position:relative;display:flex;justify-content:space-between;align-items:center;min-height:30px;padding:0 14px;margin-bottom:14px;font-size:16px;line-height:22px;font-weight:500;color:#FAF8F4}
    #plectara-four-screen-theme-review .p-island{position:absolute;top:0;left:calc(50% - 54px);width:108px;height:30px;background:#000000;border-radius:20px}
    #plectara-four-screen-theme-review .p-status-right{display:flex;align-items:center;gap:5px;background:#192D38;border-radius:5px;padding:2px 3px}
    #plectara-four-screen-theme-review .p-status-right svg{width:15px;height:15px}
    #plectara-four-screen-theme-review .p-brand-row{min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:14px}
    #plectara-four-screen-theme-review .p-logo{width:124px;height:auto;max-width:60%;display:block}
    #plectara-four-screen-theme-review .p-page-title{font-size:22px;line-height:30px;font-weight:500;margin:0;color:#FAF8F4}
    #plectara-four-screen-theme-review button{font:inherit;color:inherit}
    #plectara-four-screen-theme-review .p-gear{display:grid;place-items:center;width:44px;min-height:44px;background:#192D38;color:#FAF8F4;border:0;border-radius:10px;padding:8px}
    #plectara-four-screen-theme-review .p-gear svg{width:24px;height:24px}
    #plectara-four-screen-theme-review .p-rule{height:1px;border:0;margin:0;background:linear-gradient(90deg,transparent 0%,#C88764 16%,#C88764 84%,transparent 100%)}
    #plectara-four-screen-theme-review .p-main{padding:10px 12px 14px;display:flex;flex-direction:column;gap:20px}
    #plectara-four-screen-theme-review .p-card{background:var(--p-card);border:1px solid var(--p-border);border-radius:14px;padding:14px;color:var(--p-text);min-width:0}
    #plectara-four-screen-theme-review .p-heading{display:flex;align-items:center;gap:10px;margin:0;font-size:18px;line-height:25px;font-weight:500;letter-spacing:-.2px}
    #plectara-four-screen-theme-review .p-heading>svg{width:21px;height:21px;color:var(--p-link);flex:none}
    #plectara-four-screen-theme-review .p-progress-title{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;margin-bottom:12px}
    #plectara-four-screen-theme-review .p-icon-button{display:grid;place-items:center;width:44px;min-height:44px;border:0;padding:10px;background:transparent;color:var(--p-muted);flex:none}
    #plectara-four-screen-theme-review .p-icon-button svg{width:21px;height:21px}
    #plectara-four-screen-theme-review .p-arrow{margin-block:-7px;margin-right:-8px}
    #plectara-four-screen-theme-review .p-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    #plectara-four-screen-theme-review .p-stat{background:var(--p-control);border:1px solid var(--p-border);border-radius:9px;padding:9px 3px;min-height:88px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;min-width:0}
    #plectara-four-screen-theme-review .p-stat-name{font-size:14px;line-height:20px;font-weight:500}

    function progress(){const populated=state.todayState==='populated';return `<section class="p-card" aria-label="Your Progress"><div class="p-progress-title"><h3 class="p-heading">${icon('trophy')}Your Progress</h3><button class="p-icon-button p-arrow cursor-interaction" type="button" data-progress aria-label="View Your Progress">${icon('chevron-right')}</button></div><div class="p-stats">${[['Badges','award',populated?'8':'0'],['Streak','flame',populated?'90d':'0d'],['Points','circle-star',populated?'11.9K':'0']].map(([label,name,value],i)=>`<div class="p-stat"><span class="p-stat-name">${label}</span><span class="p-stat-value">${icon(name)}${value}</span>${populated&&i===0?`<span class="p-new">${icon('party-popper')}New</span>`:''}</div>`).join('')}</div></section>`;}
    function findings(full){return `<section class="p-card" aria-label="Insights findings"><div class="p-insight-head"><h3 class="p-heading">${icon('chart-no-axes-combined')}Insights</h3><time class="p-stamp" datetime="2026-09-28T19:00:00">September 28, 2026 at 7:00 PM</time></div><span class="p-tag">${icon('list-checks')}Rule-Derived</span><div class="p-alert">${icon('circle-alert')}Consider Contacting a Clinician</div><p class="p-finding-copy">Some patterns are concerning enough to discuss with a clinician.</p><h4 class="p-subheading">Correlations</h4>${full?`<h4 class="p-goals">${icon('chart-no-axes-combined')}Your Goals</h4><ul class="p-findings-list"><li>Toward better digestion: 2 of 10 bowel movements (20%) were in the typical range (Bristol 3–5), compared with 67% in the 14 days before.</li><li>Toward better sleep: average quality 5.6/10 and 6.9 hours asleep, compared with 6.4/10 and 7.3 hours in the 14 days before.</li></ul>`:`<ul class="p-findings-list"><li>Toward fewer, milder symptoms: average severity 4.6/10…</li></ul>`}</section>`;}
    function today(){const actions=`<div class="p-floating-actions"><button class="p-fab p-quick cursor-interaction" type="button" data-preview-action="Quick Log">${icon('zap')}Quick Log</button><button class="p-fab cursor-interaction" type="button" data-preview-action="Log">${icon('plus')}Log</button></div>`;if(state.todayState==='populated')return `${local.periodDismissed?'':`<section class="p-card p-period" aria-label="Period prediction">${icon('calendar-days')}<div><h3 class="p-period-title">Period May Start Sep 28–Oct 2</h3><p class="p-copy">Estimated from your last 5 cycles (about 28 days each).</p><button class="p-card-action cursor-interaction" type="button" data-preview-action="Log Period">Log Period</button></div><button class="p-icon-button cursor-interaction" type="button" data-dismiss-period aria-label="Dismiss period reminder">${icon('x')}</button></section>`}${progress()}${findings(false)}${actions}`;return `${progress()}<section class="p-card"><h3 class="p-heading">${icon('chart-no-axes-combined')}Insights</h3><p class="p-copy">Log a few days of meals, sleep, or symptoms.<br>Patterns show up here automatically.</p></section><section class="p-card"><h3 class="p-heading">${icon('notebook-pen')}Today's Logs</h3><p class="p-copy">Nothing logged yet. Start with a meal, symptom, or weight entry.</p><button class="p-card-action cursor-interaction" type="button" data-preview-action="Log entry">${icon('plus')}Log entry</button></section><section class="p-card"><h3 class="p-heading">${icon('calendar-days')}Last 14 Days</h3><div class="p-totals">${[['utensils','Meal'],['users-round','Bowel movement'],['bandage','Symptom'],['moon','Sleep'],['heart','Vitals'],['person-standing','Activity']].map(([name,label])=>`<div class="p-total">${icon(name)}<span>${label} · 0</span></div>`).join('')}</div></section>${actions}`;}
    function timeline(){const list=entries.filter(entry=>!local.removed.has(entry.id)&&(local.filter==='all'||entry.type===local.filter));return `<div class="p-card p-filter-panel" role="group" aria-label="Filter timeline">${[['all','All'],['meal','Meal'],['bowel','Bowel Movement']].map(([value,label])=>`<button class="p-filter cursor-interaction" type="button" data-filter="${value}" aria-pressed="${local.filter===value}">${local.filter===value?icon('check'):''}${label}</button>`).join('')}</div><section class="p-card p-timeline" aria-label="Timeline entries">${list.map(entry=>`<article class="p-entry"><span class="p-entry-icon">${icon(entry.icon)}</span><div><h3 class="p-entry-title">${entry.title}</h3><p class="p-entry-detail">${entry.detail}</p></div><button class="p-icon-button cursor-interaction" type="button" data-delete="${entry.id}" aria-label="Delete ${entry.title}">${icon('trash-2')}</button></article>`).join('')||'<p class="p-copy" style="padding:14px">No entries in this view.</p>'}</section>`;}
    function charts(){return `<section class="p-card p-controls-card" aria-label="Chart controls"><div><span class="p-control-label">Timeframe</span><div class="p-segments" role="group" aria-label="Timeframe in days">${[7,14,30].map(days=>`<button class="p-segment cursor-interaction" type="button" data-days="${days}" aria-pressed="${local.days===days}">${local.days===days?icon('check'):''}${days}</button>`).join('')}</div></div><label><span class="p-control-label">Symptom</span><select class="p-select cursor-interaction" aria-label="Symptom"><option>All Symptoms</option></select></label></section><section class="p-card"><h3 class="p-heading">Symptom Severity</h3><p class="p-chart-meta">Last ${local.days} days · 1–10 · Symptoms</p><p class="p-chart-summary">Latest 6 1–10 · Change ${local.days===14?'+2.1 1–10':'—'}</p><svg class="p-chart" role="img" aria-label="Symptom severity line reconstructed from the screenshot, fluctuating between about 4.6 and 6.4"></svg></section><section class="p-card"><h3 class="p-heading">Weight</h3><p class="p-chart-meta">Last ${local.days} days · lb · Vitals</p><p class="p-chart-summary">Latest 162.0 lb · Change ${local.days===14?'+14.4 lb':'—'}</p></section>`;}
    function insights(){return `<section class="p-card" aria-label="On-Device Pattern Review"><h3 class="p-review-title">On-Device Pattern Review</h3><p class="p-copy">Findings are rule-derived on this device. Patterns stay current as you log. A labeled OpenAI explanation may appear once a day when you open the app—this screen does not wait on the cloud.</p><button class="p-card-action p-outline-action cursor-interaction" type="button" data-preview-action="Ask About These Findings">${icon('sparkles')}Ask About These Findings</button></section>${findings(true)}`;}
    function drawCharts(){root.querySelectorAll('.p-chart').forEach(svg=>{const w=svg.clientWidth,h=215,left=29,right=w-12,top=14,bottom=h-31,start=local.days===7?22:15,end=29;const x=value=>left+(value-start)/(end-start)*(right-left),y=value=>bottom-(value-1)/9*(bottom-top);const points=chartPoints.filter(point=>point[0]>=start);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=`<title>Symptom Severity</title><desc>Visual reconstruction of the supplied symptom chart. Values vary between about 4.6 and 6.4 from September 15 through September 28.</desc>${[1,2,5,7,9,10].map(value=>`<line class="p-chart-grid" x1="${left}" y1="${y(value)}" x2="${right}" y2="${y(value)}"></line><text x="2" y="${y(value)+4}">${value}</text>`).join('')}<line class="p-chart-grid" x1="${left}" y1="${top}" x2="${left}" y2="${bottom}"></line><path class="p-chart-line" d="${points.map((point,i)=>`${i?'L':'M'}${x(point[0]).toFixed(2)},${y(point[1]).toFixed(2)}`).join(' ')}"></path>${points.map(point=>`<circle class="p-chart-dot" cx="${x(point[0])}" cy="${y(point[1])}" r="2.8"></circle>`).join('')}${(local.days===7?[22,25,29]:[15,22,29]).map((day,i)=>`<text x="${x(day)}" y="${h-7}" text-anchor="${i===0?'start':i===2?'end':'middle'}">Sep ${day}</text>`).join('')}`;});}
    function updateCaptions(){root.querySelectorAll('.p-phone').forEach(phone=>phone.closest('.p-example').querySelector('.p-caption').textContent=`${names[state.screen]} · ${phone.dataset.theme==='light'?'Light':'Dark'}`);}
    function render(){root.dataset.texture=state.texture;root.dataset.darkCard=state.darkCard;root.dataset.copper=String(state.copperBorders);root.dataset.screen=state.screen;root.querySelectorAll('.p-phone').forEach(phone=>{phone.querySelector('.p-header').innerHTML=`<div class="p-status"><span>7:01</span><span class="p-island" aria-hidden="true"></span><span class="p-status-right">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><div class="p-brand-row">${state.screen==='today'?`<img class="p-logo" src="${logo}" alt="Plectara">`:`<h2 class="p-page-title">${names[state.screen]}</h2>`}<button class="p-gear cursor-interaction" type="button" data-appearance aria-label="Appearance">${icon('settings')}</button></div>`;phone.querySelector('.p-main').innerHTML=({today,timeline,charts,insights})[state.screen]();phone.querySelector('.p-bottom-nav').innerHTML=[['calendar-days','today'],['list','timeline'],['chart-column','charts'],['chart-no-axes-combined','insights']].map(([name,key])=>`<button class="p-nav-item cursor-interaction" type="button" data-screen="${key}"${state.screen===key?' aria-current="page"':''}><span class="p-nav-icon">${icon(name)}</span><span>${names[key]}</span></button>`).join('')+'<span class="p-home-indicator" aria-hidden="true"></span>';});initializeIcons();updateCaptions();drawCharts();fitYarn();}
    let previousFocus=null;
    function closeDialog(phone){const dialog=phone.querySelector('.p-dialog');dialog.hidden=true;dialog.innerHTML='';if(previousFocus&&previousFocus.isConnected)previousFocus.focus();previousFocus=null;}
    function showDialog(phone,kind,trigger){const dialog=phone.querySelector('.p-dialog');previousFocus=trigger;dialog.hidden=false;if(kind==='appearance')dialog.innerHTML=`<div class="p-dialog-card" role="dialog" aria-modal="true" aria-label="Appearance"><h3>Appearance</h3><label>Light/Dark Mode<select class="p-select cursor-interaction" data-theme-select><option value="light">Light</option><option value="dark">Dark</option></select></label><button class="p-card-action cursor-interaction" type="button" data-close>Done</button></div>`;else if(kind==='delete'){const entry=entries.find(item=>item.id===Number(trigger.dataset.delete));dialog.innerHTML=`<div class="p-dialog-card" role="dialog" aria-modal="true" aria-label="Delete entry"><h3>Delete ${entry.title}?</h3><button class="p-card-action cursor-interaction" type="button" data-confirm-delete="${entry.id}">Delete</button><button class="p-card-action p-outline-action cursor-interaction" type="button" data-close>Cancel</button></div>`;}else dialog.innerHTML=`<div class="p-dialog-card" role="dialog" aria-modal="true" aria-label="Your Progress">${progress()}<button class="p-card-action cursor-interaction" type="button" data-close>Done</button></div>`;const select=dialog.querySelector('select');if(select)select.value=phone.dataset.theme;initializeIcons();dialog.querySelector('select,button[data-close],button[data-confirm-delete]').focus();}
    root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||!root.contains(button))return;const phone=button.closest('.p-phone');if(button.hasAttribute('data-screen')){state.screen=button.dataset.screen;render();persist();phone.querySelector(`[data-screen="${state.screen}"]`).focus();root.querySelector('.p-live').textContent=`${names[state.screen]} in both themes.`;}else if(button.hasAttribute('data-filter')){local.filter=button.dataset.filter;render();persist();phone.querySelector(`[data-filter="${local.filter}"]`).focus();}else if(button.hasAttribute('data-days')){local.days=Number(button.dataset.days);render();persist();phone.querySelector(`[data-days="${local.days}"]`).focus();}else if(button.hasAttribute('data-dismiss-period')){local.periodDismissed=true;render();persist();}else if(button.hasAttribute('data-appearance'))showDialog(phone,'appearance',button);else if(button.hasAttribute('data-progress'))showDialog(phone,'progress',button);else if(button.hasAttribute('data-delete'))showDialog(phone,'delete',button);else if(button.hasAttribute('data-confirm-delete')){local.removed.add(Number(button.dataset.confirmDelete));closeDialog(phone);render();}else if(button.hasAttribute('data-close'))closeDialog(phone);else root.querySelector('.p-live').textContent=`${button.dataset.previewAction} selected in the design preview.`;});
    root.addEventListener('change',event=>{if(event.target.matches('[data-theme-select]')){event.target.closest('.p-phone').dataset.theme=event.target.value;updateCaptions();}});
    root.addEventListener('keydown',event=>{const phone=event.target.closest('.p-phone');if(!phone)return;const dialog=phone.querySelector('.p-dialog');if(dialog.hidden)return;if(event.key==='Escape'){event.preventDefault();closeDialog(phone);}else if(event.key==='Tab'){const controls=[...dialog.querySelectorAll('select,button')];if(event.shiftKey&&document.activeElement===controls[0]){event.preventDefault();controls.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===controls.at(-1)){event.preventDefault();controls[0].focus();}}});
    restore(window.openai&&window.openai.widgetState);render();
    window.addEventListener('openai:set_globals',event=>{if(event.detail&&event.detail.globals&&event.detail.globals.widgetState){restore(event.detail.globals.widgetState);render();}});
    if(globalThis.ResizeObserver){const observer=new ResizeObserver(()=>{fitYarn();drawCharts();});root.querySelectorAll('.p-phone').forEach(phone=>observer.observe(phone));}
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});tweak.addSelect(state,'screen',{label:'Screen',options:Object.entries(names).map(([value,label])=>({value,label}))});tweak.addSelect(state,'todayState',{label:'Today content',options:[{label:'Populated screenshot',value:'populated'},{label:'Empty screenshot',value:'empty'}]});tweak.addSelect(state,'texture',{label:'Yarn placement',options:[{label:'Full screen',value:'whole'},{label:'Header only',value:'header'}]});tweak.addSelect(state,'darkCard',{label:'Dark reading cards',options:[{label:'Deep ink',value:'ink'},{label:'Lifted ink',value:'surface'}]});tweak.addToggle(state,'copperBorders',{label:'Copper card outlines'});}
  })();
  </script>
</div>

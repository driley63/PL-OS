name: plectara_insights_reference
publish_to: none
environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter
  health_diary:
    path: APP_SOURCE_PATH
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

site_name: PL-OS — Plectara Operating System
site_description: Plectara brand, component library, and product specifications
site_url: https://pl-os.plectara.com/
repo_url: https://github.com/driley63/PL-OS
repo_name: driley63/PL-OS
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  language: en
  logo: assets/brand/plectara-horizontal.svg
  favicon: assets/brand/plectara-avatar.svg
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
extra_css:
  - stylesheets/plectara.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - mermaid2
nav:
  - Home: index.md
  - Core:
      - Overview: core/README.md
      - Specification: core/SPEC.md
      - Constitution: core/constitution.md

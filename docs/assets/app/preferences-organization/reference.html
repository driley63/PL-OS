<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plectara Preferences — Design Reference</title>
<link rel="stylesheet" href="source/styles.css?v=4825a5dc418f">
<style>
html,body{margin:0;padding:0;width:1179px;min-height:2556px;background:#192d38}
#plectara-preferences-study{width:393px;zoom:3}
#plectara-preferences-study .phone{margin:0;border-radius:0;box-shadow:none}
#plectara-preferences-study .main{scrollbar-width:none}
#plectara-preferences-study .main::-webkit-scrollbar{display:none}
</style>
<script src="source/lucide.js?v=fde878a4f7ae"></script>
</head>
<body>
<div id="plectara-preferences-study"><div class="phone" data-theme="light" data-layout="hub" aria-label="Plectara Preferences design reference"></div></div>
<script>
const params=new URLSearchParams(location.search);
const scenes=[{"id": "preferences", "label": "Preferences · Section Hub", "route": "home", "description": "Approved nine-destination hub. Your Health and Settings appear first; Connections & Account continues below.", "layout": "hub"}, {"id": "preferences-lower", "label": "Preferences · Lower Groups", "route": "home", "scroll": "bottom", "description": "The same hub scrolled to show Settings and Connections & Account.", "layout": "hub"}, {"id": "health-profile", "label": "Health Profile", "route": "profile", "description": "Your Goals, About You, Conditions, and Medications share one predictable destination. Existing editor rows are placement references.", "layout": "hub"}, {"id": "tracking", "label": "Tracking & Routines", "route": "tracking", "description": "What to Track, Symptoms, logging preferences, and a contextual route to the shared reminder overview.", "layout": "hub"}, {"id": "tracking-cycle", "label": "Tracking · Cycle Available", "route": "tracking", "scroll": "bottom", "config": {"cycle": true}, "description": "Cycle Settings is shown only when available and enabled. This example does not extend eligibility or cloud sharing.", "layout": "hub"}, {"id": "quick-log", "label": "Quick Log & Widgets", "route": "quick", "description": "Saved reusable entries are separated from Quick Capture, which continues to widget pins, learned habits, and suggestions.", "layout": "hub"}, {"id": "ai", "label": "AI Insights & Chat", "route": "ai", "description": "Separate cloud explanation/plan, chat, and alcohol-sharing controls. Example values are not production defaults; native opt-in still requires complete consent disclosure.", "layout": "hub"}, {"id": "ai-details", "label": "AI · Sharing Details", "route": "ai", "scroll": "bottom", "openDetails": true, "description": "Expanded sharing information illustrates disclosure grouping. Final consent wording and native authorization flows retain their existing governing contracts.", "layout": "hub"}, {"id": "reminders", "label": "Reminders", "route": "reminders", "description": "One master preference with routes to the existing Sleep, medication, and Daily Check-In schedules. Permission-state and editor details require further design.", "layout": "hub"}, {"id": "appearance", "label": "Appearance", "route": "appearance", "description": "System, Light, and Dark remain separate choices. Both references show the same illustrative System selection.", "layout": "hub"}, {"id": "progress", "label": "Your Progress", "route": "progress", "description": "Logging points, streaks, and badges remain separate from health findings and AI.", "layout": "hub"}, {"id": "connections", "label": "Health Connections", "route": "connections", "description": "iPhone organization example. Existing connection, consent, permission, and disconnection controls must remain in the complete native flow.", "layout": "hub"}, {"id": "account", "label": "Account & Privacy", "route": "account", "description": "Account identity, provider-managed security, export, and policy routes. This is a navigation reference, not a replacement account form.", "layout": "hub"}, {"id": "account-actions", "label": "Account · Privacy & Actions", "route": "account", "scroll": "bottom", "description": "Contextual privacy links plus explicit Log Out and Delete Account buttons. Existing confirmation and deletion boundaries remain mandatory.", "layout": "hub"}];
window.referenceScene=scenes.find(s=>s.id===params.get('scene'))||scenes[0];
const phone=document.querySelector('.phone');
phone.dataset.theme=params.get('theme')==='dark'?'dark':'light';
phone.dataset.layout=window.referenceScene.layout;
document.title=window.referenceScene.label+' — Plectara Preferences';
if(params.get('scale')==='1'){
 document.querySelector('#plectara-preferences-study').style.zoom='1';
 document.documentElement.style.width=document.body.style.width='393px';
 document.documentElement.style.minHeight=document.body.style.minHeight='852px';
}
</script>
<script src="source/preferences.js?v=4a9c69c676dc"></script>
<script>
Promise.all([document.fonts.ready,...Array.from(document.images).map(i=>i.decode())]).then(()=>{
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  const main=document.querySelector('.main'),scene=window.referenceScene;
  if(scene.openDetails)main.querySelectorAll('details').forEach(d=>d.open=true);
  main.scrollTop=scene.scroll==='bottom'?main.scrollHeight:(scene.scroll||0);
  document.documentElement.dataset.captureReady='true';
 }));
});
</script>
</body>
</html>

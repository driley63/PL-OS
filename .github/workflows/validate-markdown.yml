name: Validate Repository

on:
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "amplify.yml"
      - "assets/**"
      - "docs/stylesheets/**"
      - "tooling/**"
      - ".github/workflows/validate-markdown.yml"
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Check repository layout
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f docs/index.md
          test -f docs/core/SPEC.md
          test -f docs/specs/01-brand/SPEC.md
          test -f docs/adr/0001-adopt-lifestyleiq-name.md
          test -f docs/adr/0009-adopt-docs-canonical-publishing.md
          test -f docs/releases/v1.0.1/release-notes.md
          test ! -d core
          test ! -d specs
          test ! -d adr
          test ! -d rfc
          test ! -d playbook
          test ! -d releases

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Install brand validation dependencies
        run: pip install -r tooling/requirements-brand.txt

      - name: Validate approved brand assets and color contrast
        run: |
          python tooling/build-plectara-tokens.py
          python tooling/validate-brand.py
          git diff --exit-code -- assets/tokens assets/web assets/flutter docs/stylesheets/plectara-tokens.css docs/specs/02-design/plectara-contrast-report.md assets/brand/plectara/contrast-report.md
